<!DOCTYPE html>
<html>
<head>
    <title>Fake News Detector</title>

    <style>

        body{
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
            padding-top: 80px;
        }

        .container{
            width: 50%;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        textarea{
            width: 90%;
            height: 120px;
            padding: 10px;
            font-size: 16px;
        }

        button{
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
        }

        h1{
            color: #333;
        }

        h2{
            margin-top: 20px;
            color: green;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Fake News Detection System</h1>

        <form method="POST">

            <textarea name="news" placeholder="Enter news headline here..." required></textarea>

            <br>

            <button type="submit">Check News</button>

        </form>

        <h2>{{ prediction }}</h2>

    </div>

</body>
</html>
